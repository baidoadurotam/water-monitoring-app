<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen User - Monitoring Air Aquarium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up { animation: fadeInUp 0.6s ease-out forwards; }
        .bubble {
            position: absolute;
            bottom: -20px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.05));
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.2);
            animation: floatUp 8s infinite ease-in;
            pointer-events: none;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-105vh) translateX(60px) scale(0.8); opacity: 0; }
        }
        .glow-particle {
            position: absolute;
            background: radial-gradient(circle, rgba(34, 211, 238, 0.4) 0%, rgba(34, 211, 238, 0) 70%);
            border-radius: 50%;
            animation: glowFloat 12s infinite ease-in-out;
            pointer-events: none;
        }
        @keyframes glowFloat {
            0%, 100% { transform: translateY(105vh) translateX(0) scale(1); opacity: 0; }
            20% { opacity: 0.6; }
            80% { opacity: 0.6; }
            100% { transform: translateY(-10vh) translateX(100px) scale(1.5); opacity: 0; }
        }
        .ocean {
            height: 15%;
            width: 100%;
            position: absolute;
            bottom: 0;
            left: 0;
            overflow: hidden;
            z-index: 5;
            pointer-events: none;
        }
        .wave {
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 200" fill="%231e3a8a"><path d="M0,80 C320,130 480,30 800,80 C1120,130 1280,30 1600,80 L1600,200 L0,200 Z"/></svg>') repeat-x;
            position: absolute;
            bottom: -1px;
            width: 6400px;
            height: 200px;
            animation: wave 12s cubic-bezier(0.36, 0.45, 0.63, 0.53) infinite;
            opacity: 0.6;
        }
        .wave:nth-of-type(2) {
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 200" fill="%232563eb"><path d="M0,90 C280,40 520,140 800,90 C1080,40 1320,140 1600,90 L1600,200 L0,200 Z"/></svg>') repeat-x;
            bottom: 4px;
            animation: wave 8s cubic-bezier(0.36, 0.45, 0.63, 0.53) -.125s infinite, swell 8s ease -1.25s infinite;
            opacity: 0.3;
        }
        @keyframes wave {
            0% { transform: translateX(0); }
            100% { transform: translateX(-1600px); }
        }
        @keyframes swell {
            0%, 100% { transform: translateY(-5px); }
            50% { transform: translateY(10px); }
        }
        body { background: linear-gradient(to bottom, #0f172a, #1e3a8a, #0f172a); }
    </style>
</head>
<body class="min-h-screen text-slate-100 relative overflow-x-hidden font-sans">
    <div class="absolute inset-0 w-full h-full overflow-hidden pointer-events-none z-0">
        <div class="absolute inset-0 bg-gradient-to-tr from-cyan-500/10 via-transparent to-blue-500/5 mix-blend-screen"></div>
        <div class="glow-particle w-24 h-24 left-[15%]" style="animation-duration: 14s;"></div>
        <div class="glow-particle w-32 h-32 left-[45%]" style="animation-duration: 18s; animation-delay: 3s;"></div>
        <div class="glow-particle w-20 h-20 left-[75%]" style="animation-duration: 12s; animation-delay: 6s;"></div>
        <div class="glow-particle w-40 h-40 left-[85%]" style="animation-duration: 22s; animation-delay: 1s;"></div>
        <div class="bubble w-3 h-3 left-[8%]" style="animation-duration: 6s;"></div>
        <div class="bubble w-5 h-5 left-[23%]" style="animation-duration: 9s; animation-delay: 1.5s;"></div>
        <div class="bubble w-2 h-2 left-[40%]" style="animation-duration: 5s; animation-delay: 0.5s;"></div>
        <div class="bubble w-4 h-4 left-[65%]" style="animation-duration: 10s; animation-delay: 3s;"></div>
        <div class="bubble w-3 h-3 left-[82%]" style="animation-duration: 7s; animation-delay: 2s;"></div>
        <div class="bubble w-6 h-6 left-[92%]" style="animation-duration: 11s; animation-delay: 4s;"></div>
        <div class="ocean"><div class="wave"></div><div class="wave"></div></div>
    </div>

    <div class="relative z-10 max-w-5xl mx-auto px-4 py-8">
        <div class="bg-slate-900/60 backdrop-blur-lg border border-white/10 rounded-2xl p-6 shadow-2xl animate-fade-in-up">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-bold text-white flex items-center gap-2">👥 Manajemen User</h1>
                <a href="dashboard.html" class="text-cyan-400 hover:text-cyan-300 text-sm transition hover:scale-105">← Kembali ke Dashboard</a>
            </div>
            
            <div class="bg-slate-800/50 rounded-xl p-4 mb-6 border border-white/5">
                <h2 class="text-lg font-semibold text-cyan-300 mb-3">➕ Tambah User Baru</h2>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                    <input type="text" id="new_username" placeholder="Username" class="bg-slate-700/80 rounded-lg px-3 py-2 text-white border border-slate-600 focus:ring-2 focus:ring-cyan-500">
                    <input type="password" id="new_password" placeholder="Password (min 4)" class="bg-slate-700/80 rounded-lg px-3 py-2 text-white border border-slate-600 focus:ring-2 focus:ring-cyan-500">
                    <select id="new_role" class="bg-slate-700/80 rounded-lg px-3 py-2 text-white border border-slate-600">
                        <option value="viewer">Viewer</option>
                        <option value="admin">Admin</option>
                    </select>
                    <button onclick="addUser()" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-xl font-bold transition transform hover:scale-[1.02] active:scale-[0.98]">➕ Tambah</button>
                </div>
                <div id="user_msg" class="mt-2 text-xs text-green-400"></div>
            </div>
            
            <div class="overflow-x-auto rounded-xl border border-white/10">
                <table class="min-w-full text-sm">
                    <thead class="bg-slate-800/80 text-slate-400 border-b border-white/10">
                        <tr><th class="text-left py-3 px-4">ID</th><th class="text-left">Username</th><th class="text-left">Role</th><th class="text-left">Dibuat</th><th class="text-left">Aksi</th></tr>
                    </thead>
                    <tbody id="user-list-body" class="divide-y divide-white/5">
                        <tr><td colspan="5" class="py-8 text-center text-slate-500">Memuat data user...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="editModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 hidden">
        <div class="bg-slate-800 rounded-2xl p-6 w-96 border border-white/20 shadow-2xl">
            <h3 class="text-lg font-bold text-white mb-4">✏️ Edit User</h3>
            <input type="hidden" id="edit_id">
            <div class="mb-3"><label class="block text-slate-300 text-sm mb-1">Username</label><input type="text" id="edit_username" class="w-full bg-slate-900 rounded-lg px-3 py-2 text-white border border-slate-700 focus:ring-2 focus:ring-cyan-500"></div>
            <div class="mb-3"><label class="block text-slate-300 text-sm mb-1">Password Baru <span class="text-slate-500">(kosongkan jika tidak diubah)</span></label><input type="password" id="edit_password" class="w-full bg-slate-900 rounded-lg px-3 py-2 text-white border border-slate-700 focus:ring-2 focus:ring-cyan-500"></div>
            <div class="mb-4"><label class="block text-slate-300 text-sm mb-1">Role</label><select id="edit_role" class="w-full bg-slate-900 rounded-lg px-3 py-2 text-white border border-slate-700"><option value="viewer">Viewer</option><option value="admin">Admin</option></select></div>
            <div class="flex justify-end space-x-3">
                <button onclick="closeModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-xl transition">Batal</button>
                <button onclick="saveEdit()" class="px-4 py-2 bg-cyan-600 hover:bg-cyan-500 rounded-xl font-bold transition">Simpan</button>
            </div>
        </div>
    </div>

    <script>
        const role = localStorage.getItem('role');
        if (role !== 'admin') { alert('Halaman ini hanya untuk admin.'); window.location.href = 'dashboard.html'; }
        let currentUserRole = role;

        async function loadUsers() {
            try {
                const res = await fetch(`/api/users?role=${currentUserRole}`);
                if (!res.ok) throw new Error('Gagal memuat user');
                const users = await res.json();
                const tbody = document.getElementById('user-list-body');
                if (users.length === 0) { tbody.innerHTML = '<tr><td colspan="5" class="py-8 text-center text-slate-500">Belum ada user selain admin</td></tr>'; return; }
                tbody.innerHTML = users.map(user => `
                    <tr class="hover:bg-white/5 transition">
                        <td class="py-3 px-4">${user.id}</td>
                        <td class="py-3">${escapeHtml(user.username)}</td>
                        <td class="py-3"><span class="px-2 py-0.5 rounded-full text-xs ${user.role === 'admin' ? 'bg-red-500/20 text-red-300' : 'bg-blue-500/20 text-blue-300'}">${user.role}</span></td>
                        <td class="py-3 text-xs">${user.created_at || '-'}</td>
                        <td class="py-3">
                            <button onclick="openEdit(${user.id}, '${escapeHtml(user.username)}', '${user.role}')" class="text-cyan-400 hover:text-cyan-300 text-xs mr-2">✏️ Edit</button>
                            ${user.role !== 'admin' ? `<button onclick="deleteUser(${user.id})" class="text-red-400 hover:text-red-300 text-xs">🗑️ Hapus</button>` : ''}
                        </td>
                    </tr>
                `).join('');
            } catch(err) { console.error(err); document.getElementById('user-list-body').innerHTML = '<tr><td colspan="5" class="py-8 text-center text-red-400">Gagal memuat user</td></tr>'; }
        }

        async function addUser() {
            const username = document.getElementById('new_username').value.trim();
            const password = document.getElementById('new_password').value;
            const role = document.getElementById('new_role').value;
            if (!username || !password) { alert('Username dan password wajib diisi'); return; }
            if (password.length < 4) { alert('Password minimal 4 karakter'); return; }
            try {
                const res = await fetch('/api/users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, role, adminRole: currentUserRole })
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('user_msg').innerText = '✓ ' + data.message;
                    document.getElementById('new_username').value = '';
                    document.getElementById('new_password').value = '';
                    loadUsers();
                    setTimeout(() => document.getElementById('user_msg').innerText = '', 3000);
                } else alert('Gagal: ' + data.message);
            } catch(err) { alert('Error: ' + err.message); }
        }

        async function deleteUser(userId) {
            if (!confirm('Yakin hapus user ini?')) return;
            try {
                const res = await fetch(`/api/users/${userId}`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ adminRole: currentUserRole })
                });
                const data = await res.json();
                if (data.success) loadUsers();
                else alert('Gagal: ' + data.message);
            } catch(err) { alert('Error: ' + err.message); }
        }

        function openEdit(id, username, role) {
            document.getElementById('edit_id').value = id;
            document.getElementById('edit_username').value = username;
            document.getElementById('edit_password').value = '';
            document.getElementById('edit_role').value = role;
            document.getElementById('editModal').classList.remove('hidden');
        }
        function closeModal() { document.getElementById('editModal').classList.add('hidden'); }
        async function saveEdit() {
            const id = document.getElementById('edit_id').value;
            const username = document.getElementById('edit_username').value.trim();
            const password = document.getElementById('edit_password').value;
            const role = document.getElementById('edit_role').value;
            if (!username) { alert('Username tidak boleh kosong'); return; }
            const payload = { adminRole: currentUserRole };
            if (username) payload.username = username;
            if (password && password.length > 0) { if (password.length < 4) { alert('Password minimal 4 karakter'); return; } payload.password = password; }
            if (role) payload.role = role;
            try {
                const res = await fetch(`/api/users/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.success) { alert('✅ User berhasil diperbarui'); closeModal(); loadUsers(); }
                else alert('❌ Gagal: ' + data.message);
            } catch(err) { alert('Error: ' + err.message); }
        }

        function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'); }
        loadUsers();
    </script>
</body>
</html>
