<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Aquarium Water Monitoring</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Animasi Card Masuk */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up { animation: fadeInUp 0.6s ease-out forwards; }

        /* =========================================================================
           ANIMASI BARU: PARTIKEL CAHAYA & GELEMBUNG AQUARIUM
           ========================================================================= */
        .bubble {
            position: absolute;
            bottom: -20px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.05));
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.2);
            animation: floatUp 8s infinite ease-in;
        }

        /* Efek Partikel Cahaya Mengambang */
        .glow-particle {
            position: absolute;
            background: radial-gradient(circle, rgba(34, 211, 238, 0.4) 0%, rgba(34, 211, 238, 0) 70%);
            border-radius: 50%;
            animation: glowFloat 12s infinite ease-in-out;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-105vh) translateX(60px) scale(0.8); opacity: 0; }
        }

        @keyframes glowFloat {
            0%, 100% { transform: translateY(105vh) translateX(0) scale(1); opacity: 0; }
            20% { opacity: 0.6; }
            80% { opacity: 0.6; }
            100% { transform: translateY(-10vh) translateX(100px) scale(1.5); opacity: 0; }
        }

        /* =========================================================================
           OMBAK DI AREA DASAR
           ========================================================================= */
        .ocean {
            height: 15%;
            width: 100%;
            position: absolute;
            bottom: 0;
            left: 0;
            overflow: hidden;
            z-index: 5;
        }
        .wave {
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 200" fill="%231e3a8a"><path d="M0,80 C320,130 480,30 800,80 C1120,130 1280,30 1600,80 L1600,200 L0,200 Z"/></svg>') repeat-x;
            position: absolute;
            bottom: -1px;
            width: 6400px;
            height: 200px;
            animation: wave 12s cubic-bezier(0.36, 0.45, 0.63, 0.53) infinite;
            opacity: 0.6;
        }
        .wave:nth-of-type(2) {
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 200" fill="%232563eb"><path d="M0,90 C280,40 520,140 800,90 C1080,40 1320,140 1600,90 L1600,200 L0,200 Z"/></svg>') repeat-x;
            bottom: 4px;
            animation: wave 8s cubic-bezier(0.36, 0.45, 0.63, 0.53) -.125s infinite, swell 8s ease -1.25s infinite;
            opacity: 0.3;
        }
        @keyframes wave {
            0% { transform: translateX(0); }
            100% { transform: translateX(-1600px); }
        }
        @keyframes swell {
            0%, 100% { transform: translateY(-5px); }
            50% { transform: translateY(10px); }
        }
    </style>
</head>
<body class="bg-gradient-to-b from-slate-950 via-blue-950 to-slate-950 flex items-center justify-center h-screen relative overflow-hidden m-0 p-0">

    <div class="absolute inset-0 w-full h-full overflow-hidden pointer-events-none z-0">
        <div class="absolute inset-0 bg-gradient-to-tr from-cyan-500/10 via-transparent to-blue-500/5 mix-blend-screen"></div>

        <div class="glow-particle w-24 h-24 left-[15%]" style="animation-duration: 14s; animation-delay: 0s;"></div>
        <div class="glow-particle w-32 h-32 left-[45%]" style="animation-duration: 18s; animation-delay: 3s;"></div>
        <div class="glow-particle w-20 h-20 left-[75%]" style="animation-duration: 12s; animation-delay: 6s;"></div>
        <div class="glow-particle w-40 h-40 left-[85%]" style="animation-duration: 22s; animation-delay: 1s;"></div>

        <div class="bubble w-3 h-3 left-[8%]" style="animation-duration: 6s; animation-delay: 0s;"></div>
        <div class="bubble w-5 h-5 left-[23%]" style="animation-duration: 9s; animation-delay: 1.5s;"></div>
        <div class="bubble w-2 h-2 left-[40%]" style="animation-duration: 5s; animation-delay: 0.5s;"></div>
        <div class="bubble w-4 h-4 left-[65%]" style="animation-duration: 10s; animation-delay: 3s;"></div>
        <div class="bubble w-3 h-3 left-[82%]" style="animation-duration: 7s; animation-delay: 2s;"></div>
        <div class="bubble w-6 h-6 left-[92%]" style="animation-duration: 11s; animation-delay: 4s;"></div>

        <div class="ocean">
            <div class="wave"></div>
            <div class="wave"></div>
        </div>
    </div>

    <div class="bg-slate-900/60 backdrop-blur-lg p-8 rounded-2xl shadow-2xl w-96 border border-white/10 opacity-0 animate-fade-in-up relative z-10">
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-gradient-to-tr from-blue-600 to-cyan-400 text-white rounded-full flex items-center justify-center mx-auto text-3xl shadow-lg mb-3 animate-bounce">
                🐠
            </div>
            <h2 class="text-2xl font-bold text-white tracking-wide">Monitoring</h2>
            <p class="text-sm text-cyan-300 mt-1">Suhu & Kekeruhan Air Aquarium</p>
        </div>

        <div id="error-msg" class="hidden bg-red-950/70 text-red-300 border border-red-800/50 p-3 rounded-xl mb-4 text-sm text-center font-medium"></div>
        
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-slate-300 text-sm font-medium mb-1.5">Username Admin</label>
                <input type="text" id="username" class="w-full bg-slate-950/80 px-4 py-2.5 border border-slate-800 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition-all duration-200" placeholder="Username" required>
            </div>
            <div>
                <label class="block text-slate-300 text-sm font-medium mb-1.5">Password</label>
                <input type="password" id="password" class="w-full bg-slate-950/80 px-4 py-2.5 border border-slate-800 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition-all duration-200" placeholder="••••••••" required>
            </div>
            
            <button type="submit" id="btn-submit" class="w-full bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-blue-500 hover:to-cyan-500 text-white py-3 rounded-xl font-bold hover:scale-[1.01] active:scale-[0.99] transition-all duration-200 shadow-lg shadow-cyan-600/20 flex items-center justify-center space-x-2">
                <span id="btn-text">Masuk ke Dashboard</span>
                <svg id="btn-spinner" class="hidden animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');
            const btnText = document.getElementById('btn-text');
            const btnSpinner = document.getElementById('btn-spinner');
            const btnSubmit = document.getElementById('btn-submit');

            btnText.innerText = "Membuka Gerbang...";
            btnSpinner.classList.remove('hidden');
            btnSubmit.disabled = true;
            errorMsg.classList.add('hidden');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                setTimeout(() => {
                    if (data.success) {
                        window.location.href = '/dashboard.html';
                    } else {
                        btnText.innerText = "Masuk ke Dashboard";
                        btnSpinner.classList.add('hidden');
                        btnSubmit.disabled = false;
                        errorMsg.innerText = data.message;
                        errorMsg.classList.remove('hidden');
                    }
                }, 800);

            } catch (err) {
                btnText.innerText = "Masuk ke Dashboard";
                btnSpinner.classList.add('hidden');
                btnSubmit.disabled = false;
                errorMsg.innerText = "Gagal terhubung ke server!";
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
