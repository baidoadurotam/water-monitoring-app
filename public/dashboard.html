<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Realtime Kualitas Air</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-100 font-sans">
    <div class="flex h-screen">
        <div class="w-64 bg-slate-800 text-white p-6 flex flex-col justify-between">
            <div>
                <h1 class="text-xl font-bold mb-8 text-blue-400">🌊 H2O Monitor</h1>
                <nav class="space-y-2">
                    <a href="#" class="block px-4 py-2.5 bg-slate-700 rounded-lg font-medium">Dashboard Realtime</a>
                </nav>
            </div>
            <a href="/login.html" class="block px-4 py-2 text-center bg-red-600 hover:bg-red-700 rounded-lg font-bold transition">Logout</a>
        </div>

        <div class="flex-1 p-8 overflow-y-auto">
            <h2 class="text-3xl font-bold text-slate-800 mb-6">Status Kualitas Air</h2>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <p class="text-sm font-semibold text-slate-500 uppercase">Suhu Air</p>
                    <p id="txt-suhu" class="text-4xl font-extrabold text-red-500 mt-2">0.0 °C</p>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <p class="text-sm font-semibold text-slate-500 uppercase">Kekeruhan (Turbidity)</p>
                    <p id="txt-keruh" class="text-4xl font-extrabold text-blue-500 mt-2">0.0 NTU</p>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <p class="text-sm font-semibold text-slate-500 uppercase">Indeks Kualitas</p>
                    <div id="badge-kualitas" class="inline-block px-3 py-1 rounded-full text-sm font-bold bg-green-100 text-green-700 mt-3">Mengambil Data...</div>
                </div>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-8">
                <h3 class="text-lg font-bold text-slate-700 mb-4">Grafik Tren Realtime (Analog)</h3>
                <div class="h-72">
                    <canvas id="realtimeChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Inisialisasi Chart.js
        const ctx = document.getElementById('realtimeChart').getContext('2d');
        const configChart = {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    { label: 'Suhu (°C)', data: [], borderColor: '#ef4444', backgroundColor: 'rgba(239,68,68,0.1)', tension: 0.3, yAxisID: 'y' },
                    { label: 'Kekeruhan (NTU)', data: [], borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,0.1)', tension: 0.3, yAxisID: 'y1' }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { type: 'linear', display: true, position: 'left', title: { display: true, text: 'Suhu (°C)' } },
                    y1: { type: 'linear', display: true, position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: 'Kekeruhan (NTU)' } }
                }
            }
        };
        const airChart = new Chart(ctx, configChart);

        // HUBUNGKAN WEBSOCKET KE SERVER (PORT 3000)
        // Karena dijalankan di localhost/server yang sama, kita pakai window.location.host
        const ws = new WebSocket(`ws://${window.location.host}`);

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            const waktuLokal = new Date(data.timestamp * 1000).toLocaleTimeString();

            // 1. Update Tampilan Digital Indikator
            document.getElementById('txt-suhu').innerText = data.suhu.toFixed(1) + " °C";
            document.getElementById('txt-keruh').innerText = data.kekeruhan.toFixed(1) + " NTU";

            // 2. Logika Hitung Indeks Kualitas Air
            const badge = document.getElementById('badge-kualitas');
            if (data.kekeruhan > 50 || data.suhu > 30) {
                badge.innerText = "🚨 KUALITAS BURUK / KERUH";
                badge.className = "inline-block px-3 py-1 rounded-full text-sm font-bold bg-red-100 text-red-700 mt-3";
            } else {
                badge.innerText = "✅ KUALITAS BAIK / JERNIH";
                badge.className = "inline-block px-3 py-1 rounded-full text-sm font-bold bg-green-100 text-green-700 mt-3";
            }

            // 3. Update Grafik Analog (Maksimal menampilkan 10 data berjalan)
            if (airChart.data.labels.length > 10) {
                airChart.data.labels.shift();
                airChart.data.datasets[0].data.shift();
                airChart.data.datasets[1].data.shift();
            }

            airChart.data.labels.push(waktuLokal);
            airChart.data.datasets[0].data.push(data.suhu);
            airChart.data.datasets[1].data.push(data.kekeruhan);
            airChart.update();
        };

        ws.onerror = (err) => console.error("Koneksi WebSocket Error:", err);
    </script>
</body>
</html>
